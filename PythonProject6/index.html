<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Zone</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f1015; color: #fff; }
        header { background: #161822; padding: 15px 5%; display: flex; align-items: center; gap: 15px; border-bottom: 2px solid #00ffcc; }
        header img { height: 45px; border-radius: 8px; }
        header .logo-text { font-size: 1.5rem; font-weight: bold; color: #00ffcc; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .section-title { font-size: 1.8rem; margin-bottom: 20px; color: #fff; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .game-card { background: #1a1c26; border-radius: 12px; overflow: hidden; cursor: pointer; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .game-card img { width: 100%; height: 180px; object-fit: cover; }
        .game-title { padding: 10px; font-size: 0.9rem; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Logo">
        <div class="logo-text">ARCADE ZONE</div>
    </header>

    <div class="container">
        <h2 class="section-title">أحدث الألعاب 🔥</h2>
        <div class="games-grid" id="gamesContainer">
            <p style="grid-column: 1/-1; text-align: center;">جاري تحميل الألعاب...</p>
        </div>
    </div>

    <script>
        const gamesContainer = document.getElementById('gamesContainer');
        const feedUrl = 'https://gamemonetize.com/feed.php?format=0&page=1';

        fetch(feedUrl)
            .then(res => res.json())
            .then(games => {
                gamesContainer.innerHTML = '';
                games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <img src="${game.thumb}" alt="${game.title}">
                        <div class="game-title">${game.title}</div>
                    `;
                    card.onclick = () => window.open(game.url, '_blank');
                    gamesContainer.appendChild(card);
                });
            })
            .catch(err => {
                console.error(err);
                gamesContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">ارفع الموقع أونلاين حتى تظهر الألعاب (بسبب حظر المتصفح المحلي).</p>';
            });
    </script>
</body>
</html>
